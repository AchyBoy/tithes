<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tithes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%93%97</text></svg>">
<title>Tithe Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#F7F5F0; --surface:#FFFDFA; --sunk:#EFEDE6;
  --ink:#1B211F; --ink-2:#4A524E; --ink-3:#7C837E;
  --line:#DFDBD1; --line-2:#EAE6DD;
  --accent:#2E6E5B; --accent-soft:#DCEAE3;
  --credit:#2E6E5B; --debit:#8C4A3A;
  --park:#C0762A; --park-soft:#F7E7D2;
  --look:#6B5A93; --look-soft:#E8E3F2;
  --park-line:#E3B98A; --accent-line:#9CC4B4;
  --warn:#A33A2E;
  --shadow:0 1px 2px rgba(27,33,31,.05), 0 8px 24px -12px rgba(27,33,31,.14);
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131615; --surface:#1B201E; --sunk:#232825;
    --ink:#E9E7E0; --ink-2:#AAB2AD; --ink-3:#7A827D;
    --line:#2F3633; --line-2:#262C2A;
    --accent:#63AC92; --accent-soft:#1E3129;
    --credit:#63AC92; --debit:#D08A75;
    --park:#D9944A; --park-soft:#3A2A17;
    --look:#A492D0; --look-soft:#282243;
    --park-line:#6B4A24; --accent-line:#37604F;
    --warn:#E0705E;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#131615; --surface:#1B201E; --sunk:#232825;
  --ink:#E9E7E0; --ink-2:#AAB2AD; --ink-3:#7A827D;
  --line:#2F3633; --line-2:#262C2A;
  --accent:#63AC92; --accent-soft:#1E3129;
  --credit:#63AC92; --debit:#D08A75;
  --park:#D9944A; --park-soft:#3A2A17;
  --look:#A492D0; --look-soft:#282243;
  --park-line:#6B4A24; --accent-line:#37604F;
  --warn:#E0705E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

.wrap{max-width:1180px; margin:0 auto; padding:0 20px 80px}

/* ---------- masthead ---------- */
header{padding:34px 0 0}
.brand{display:flex; align-items:baseline; justify-content:space-between; gap:20px; flex-wrap:wrap}
h1{
  font-family:Newsreader,Georgia,serif; font-weight:500; font-size:31px;
  margin:0; letter-spacing:-.01em;
}
h1 em{font-style:italic; color:var(--accent)}
.acts{display:flex; gap:8px; flex-wrap:wrap}
.btn{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:7px 13px; font-size:13.5px; font-weight:500; color:var(--ink-2);
  transition:border-color .15s, color .15s;
}
.btn:hover{border-color:var(--ink-3); color:var(--ink)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{filter:brightness(1.08); color:#fff}

/* ---------- month rail ---------- */
.months{
  display:flex; gap:2px; margin:22px 0 0; padding-bottom:2px;
  overflow-x:auto; border-bottom:1px solid var(--line);
}
.mtab{
  background:none; border:0; border-bottom:2px solid transparent;
  padding:9px 14px 10px; white-space:nowrap; color:var(--ink-3);
  font-size:14px; font-weight:500; letter-spacing:.01em;
}
.mtab:hover{color:var(--ink)}
.mtab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.mtab small{display:block; font-size:11px; font-weight:400; color:var(--ink-3); letter-spacing:.02em}

/* ---------- summary ---------- */
.summary{
  display:grid; gap:1px; background:var(--line-2);
  grid-template-columns:1.5fr 1fr 1fr 1fr; margin:26px 0 0;
  border:1px solid var(--line-2); border-radius:var(--r); overflow:hidden;
}
.cell{background:var(--surface); padding:16px 18px 17px}
.cell .k{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--ink-3); font-weight:600; margin-bottom:7px;
}
.cell .v{font-size:20px; font-weight:500; letter-spacing:-.01em}
.owed{background:var(--accent-soft)}
.owed .k{color:var(--accent)}
.owed .v{font-family:Newsreader,Georgia,serif; font-size:34px; font-weight:500; color:var(--accent); line-height:1.05}
.owed .sub{font-size:12px; color:var(--ink-2); margin-top:5px}
.pos{color:var(--credit)} .neg{color:var(--debit)}

.drift{
  margin-top:10px; padding:9px 13px; border-radius:var(--r); font-size:13px;
  background:var(--park-soft); color:var(--ink); border:1px solid var(--park);
  display:flex; gap:9px; align-items:flex-start;
}
.drift b{font-weight:600}

/* ---------- toolbar ---------- */
.bar{display:flex; gap:10px; align-items:center; margin:22px 0 12px; flex-wrap:wrap}
.search{
  flex:1; min-width:220px; display:flex; align-items:center; gap:9px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:0 12px;
}
.search input{
  flex:1; border:0; background:none; padding:10px 0; font:inherit; color:var(--ink);
}
.search input:focus{outline:none}
.search svg{flex:none; opacity:.45}
.chips{display:flex; gap:5px; flex-wrap:wrap}
.chip{
  background:var(--surface); border:1px solid var(--line); border-radius:99px;
  padding:6px 12px; font-size:12.5px; font-weight:500; color:var(--ink-2);
}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.count{font-size:12.5px; color:var(--ink-3); margin-left:auto}

/* ---------- ledger ---------- */
.scroll{
  overflow-x:auto; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); box-shadow:var(--shadow);
}
table{border-collapse:collapse; width:100%; min-width:820px}
th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--ink-3); font-weight:600; padding:11px 12px;
  border-bottom:1px solid var(--line); background:var(--sunk);
  position:sticky; top:0; z-index:1;
}
td{padding:9px 12px; border-bottom:1px solid var(--line-2); font-size:13.5px; vertical-align:top}
tr:last-child td{border-bottom:0}
.r-amt,.r-cnt{text-align:right; white-space:nowrap}
.r-date{white-space:nowrap; color:var(--ink-2)}
.r-type{color:var(--ink-3); font-size:12.5px; white-space:nowrap}
.r-desc{min-width:230px}
tr.parked td{background:var(--park-soft)}
tr.parked .r-desc,tr.parked .r-amt{text-decoration:line-through; opacity:.72}
tr.look td{background:var(--look-soft)}
.tag{
  display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px;
  font-weight:600; letter-spacing:.01em; white-space:nowrap;
  background:var(--sunk); color:var(--ink-2);
}
.tag.on{background:var(--accent-soft); color:var(--accent)}
.tag.off{background:var(--park-soft); color:var(--park)}
.tag.look{background:var(--look-soft); color:var(--look)}
.tog,.inc{
  width:27px; height:27px; border-radius:7px; border:1.5px solid;
  background:var(--surface); display:grid; place-items:center; padding:0;
  font-size:15px; line-height:1; font-weight:600;
  transition:background .12s, border-color .12s, color .12s;
}
.tog{border-color:var(--park-line); color:var(--park)}
.tog:hover{background:var(--park-soft); border-color:var(--park)}
.tog[aria-pressed="true"]{background:var(--park); border-color:var(--park); color:#fff}
.inc{border-color:var(--accent-line); color:var(--accent)}
.inc:hover{background:var(--accent-soft); border-color:var(--accent)}
.inc.on{background:var(--accent); border-color:var(--accent); color:#fff}
tr.grp td{background:var(--sunk); border-top:1px solid var(--line)}
tr.grp td:first-child{letter-spacing:.02em}
tr.acct{cursor:pointer}
tr.acct:hover td{background:var(--sunk)}
.empty{padding:44px 20px; text-align:center; color:var(--ink-3); font-size:14px}
mark{background:var(--accent-soft); color:inherit; border-radius:3px; padding:0 2px}

/* ---------- panel ---------- */
.scrim{
  position:fixed; inset:0; background:rgba(20,24,22,.45); backdrop-filter:blur(2px);
  display:grid; place-items:center; padding:20px; z-index:50;
}
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  width:min(780px,100%); max-height:88vh; overflow:auto; box-shadow:var(--shadow);
}
.phead{
  display:flex; justify-content:space-between; align-items:center; gap:14px;
  padding:18px 22px; border-bottom:1px solid var(--line-2); position:sticky; top:0;
  background:var(--surface);
}
.phead h2{font-family:Newsreader,Georgia,serif; font-weight:500; font-size:21px; margin:0}
.pbody{padding:20px 22px 24px}
.hint{font-size:13px; color:var(--ink-2); margin:0 0 12px}
textarea{
  width:100%; min-height:190px; resize:vertical; padding:12px;
  border:1px solid var(--line); border-radius:var(--r); background:var(--paper);
  color:var(--ink); font-family:"IBM Plex Mono",monospace; font-size:12px; line-height:1.55;
}
textarea:focus{outline:none; border-color:var(--accent)}
.readout{
  margin-top:14px; border:1px solid var(--line); border-radius:var(--r);
  padding:14px 16px; background:var(--paper); font-size:13.5px;
}
.readout .row{display:flex; justify-content:space-between; gap:16px; padding:3px 0}
.readout .row span:last-child{font-family:"IBM Plex Mono",monospace}
.ok{color:var(--accent); font-weight:600}
.bad{color:var(--warn); font-weight:600}
.pfoot{display:flex; justify-content:flex-end; gap:9px; margin-top:16px}

.rule{border-bottom:1px solid var(--line-2); padding:14px 0}
.rule:last-child{border-bottom:0}
.rule h3{margin:0 0 3px; font-size:14px; font-weight:600}
.rule p{margin:0 0 9px; font-size:12.5px; color:var(--ink-3)}
.keys{display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.key{
  display:inline-flex; align-items:center; gap:6px; background:var(--sunk);
  border:1px solid var(--line); border-radius:99px; padding:3px 5px 3px 10px;
  font-family:"IBM Plex Mono",monospace; font-size:11.5px;
}
.key button{border:0; background:none; padding:0 3px; color:var(--ink-3); line-height:1; font-size:14px}
.key button:hover{color:var(--warn)}
.addkey{
  border:1px dashed var(--line); background:none; border-radius:99px; padding:4px 11px;
  font-size:11.5px; color:var(--ink-3);
}
.addkey:hover{border-color:var(--accent); color:var(--accent)}
.note{font-size:12.5px; color:var(--ink-3); margin:18px 0 0; line-height:1.6}
.offline{
  margin:26px 0; padding:14px 16px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); color:var(--ink-2); font-size:13.5px;
}

/* ---------- lock ---------- */
.gate{min-height:62vh; display:grid; place-items:center; padding:30px 0}
.lockbox{
  width:min(380px,100%); background:var(--surface); border:1px solid var(--line);
  border-radius:14px; padding:28px 26px 24px; box-shadow:var(--shadow); text-align:left;
}
.lockbox h2{
  font-family:Newsreader,Georgia,serif; font-weight:500; font-size:22px; margin:0 0 5px;
}
.lockbox p{margin:0 0 18px; font-size:13.5px; color:var(--ink-2); line-height:1.55}
.lockbox label{
  display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--ink-3); font-weight:600; margin-bottom:6px;
}
.lockbox input[type="password"]{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--paper); color:var(--ink); font:inherit; letter-spacing:.06em;
}
.lockbox input[type="password"]:focus{outline:none; border-color:var(--accent)}
.lockbox .btn.primary{width:100%; margin-top:14px; padding:11px}
.lockbox .err{color:var(--warn); font-size:13px; margin:11px 0 0; font-weight:500}
.lockbox .fine{font-size:11.5px; color:var(--ink-3); margin:16px 0 0; line-height:1.55}
.hidden-user{position:absolute; left:-9999px; width:1px; height:1px; opacity:0}
@media (max-width:860px){
  .summary{grid-template-columns:1fr 1fr}
  .owed{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>Tithe <em>Ledger</em></h1>
      <div class="acts">
        <button class="btn" id="btnBooks">Books</button>
        <button class="btn" id="btnLock">Lock</button>
        <button class="btn" id="btnPw">Password</button>
        <button class="btn" id="btnRules">Rules</button>
        <button class="btn primary" id="btnPaste">Paste a month</button>
      </div>
    </div>
    <div class="months" id="months" role="tablist"></div>
  </header>
  <main id="main"></main>
</div>

<script>
"use strict";

/* ============ defaults: the rules, ported from the Apps Script ============ */
const DEFAULT_RULES = {
  // The real keyword lists live on the server and arrive after you unlock.
  // Nothing about what you buy or who you buy it from ships in this file.
  subs:[], vendor:[], ew:[], half:[], always:[], review:[]
};
const RULE_META = {
  subs:  {name:"Recurring subscriptions", why:"Deducted in full. Matches only rows typed Recurring Card Purchase."},
  vendor:{name:"Vendor purchases",        why:"Deducted in full. Matches Card Purchase and Card Purchase With Pin."},
  ew:    {name:"Electronic withdrawals",  why:"Deducted in full. Matches only rows typed Electronic Withdrawal."},
  half:  {name:"Half rule",               why:"Half the amount is deducted, whatever kind of row it is. Part business, part personal."},
  always:{name:"Always counted", why:"Deducted in full whatever kind of row it is. A row you counted by hand ends up here."},
  review:{name:"Flag for a look",         why:"Never deducted. Highlighted so you can decide each month."}
};

/* ============ classify one row — same order of tests as the script ============ */
function classify(row, R){
  const t = row.t || "", d = (row.c || "").toLowerCase(), a = Number(row.a) || 0;
  const hit = list => (R[list] || []).some(k => d.includes(k));
  if (row.x)                                            return {f:0, rule:"Excluded",  kind:"off"};
  if (row.i)                                            return {f:a, rule:"Counted by hand", kind:"on"};
  if (t === "Check Paid")                               return {f:-Math.abs(a), rule:"Check paid", kind:"on"};
  if (t === "Deposit" || t === "Refund")                return {f:a, rule:"Deposit", kind:"on"};
  if (t === "Recurring Card Purchase" && hit("subs"))   return {f:-Math.abs(a), rule:"Subscription", kind:"on"};
  if ((t === "Card Purchase" || t === "Card Purchase With Pin") && hit("vendor"))
                                                        return {f:-Math.abs(a), rule:"Vendor", kind:"on"};
  if (t === "Electronic Withdrawal" && hit("ew"))       return {f:-Math.abs(a), rule:"Withdrawal", kind:"on"};
  if (t === "Electronic Withdrawal" && d.includes("paypal / ebay") && Math.abs(a) > 45)
                                                        return {f:-Math.abs(a), rule:"PayPal/eBay", kind:"on"};
  if (d.includes("apple cash"))                         return {f:-Math.abs(a), rule:"Apple Cash", kind:"on"};
  if (hit("half"))                                      return {f:-Math.abs(a)/2, rule:"Half rule", kind:"on"};
  if (t === "Fee" && d.includes("monthly service fee")) return {f:-Math.abs(a), rule:"Monthly fee", kind:"on"};
  if (hit("always"))                                    return {f:a, rule:"Counted", kind:"on"};
  if (hit("review"))                                    return {f:0, rule:"Take a look", kind:"look"};
  return {f:0, rule:"", kind:""};
}

function totals(rows, R){
  let income = 0, out = 0, base = 0;
  for (const row of rows){
    const c = classify(row, R);
    base += c.f;
    if (row.x) continue;
    const a = Number(row.a) || 0;
    if (row.t === "Deposit" || row.t === "Refund") income += Math.abs(a);
    else if (a) out += Math.abs(a);
  }
  return {income, out, base, owed: base * 0.1};
}

/* ============ read a Chase export ============ */
function splitRow(line){
  // Chase hands out both shapes: comma-separated with quoted fields, and
  // tab-separated with none. A tab is never a value here, so its presence
  // settles which one this is.
  if (line.includes("\t")) return line.split("\t").map(s => s.trim());
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++){
    const ch = line[i];
    if (q){
      if (ch === '"'){ if (line[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

const ACH = [
  ["ANDRIES BUILDERS","Andries Builders \u2013 ACH (Foch Electrical CCD)"],
  ["CITI CARD ONLINE","Citi Card Online Payment"],
  ["CHASE CREDIT CRD","Chase Credit Crd Autopay"],
  ["ALLIANT CU","Alliant CU \u2013 Dep-Pymt"],
  ["ALLY","Ally Payment"],
  ["IPFS","IPFS800-247-6129"],
  ["LCI PREM TRUST","LCI Premium Trust \u2013 Corp Coll"],
  ["LOWES","Lowes Payment"],
  ["LA FARM BUREAU","LA Farm Bureau Insurance"],
  ["ATT ","AT&T Payment"],
  ["IRS","IRS"],
  ["LOUISIANA REVEN","LOUISIANA REVEN"],
  ["SBA LOAN","SBA Loan Payment"],
  ["TD AUTO FINANCE","TD Auto Finance \u2013 Web Pay"],
  ["NORTHWESTERN MU","NORTHWESTERN MU"],
  ["NATIONAL RECOVER","National Recover"],
  ["SANTANDER","SANTANDER"],
  ["PLANET CONSTRUCT","Planet Construct \u2013 ACH (Foch Electrical CCD)"],
  ["STRIPE","Stripe \u2013 Transfer"]
];
const SUBS_DESC = [["GOOGLE *WORKSPACE","Google Workspace"],["ANTHROPIC","Anthropic / Claude Subscription"],
                   ["RAILWAY","Railway \u2013 Railway.com"],["COMPANYCAM","CompanyCam"],
                   ["650 INDUSTRIES","650 Industries (Expo) \u2013 Expo.dev"]];

function tidy(s){
  return s.replace(/\s+\d{2}\/\d{2}$/,"").replace(/\s+\d{6}\s*$/,"").replace(/\s+/g," ").trim();
}

function parseExport(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const out = [], problems = [];
  let chain = null, breaks = 0, checked = 0;
  const prev = [];

  for (const line of lines){
    const f = splitRow(line);
    if (f.length < 5) continue;
    if (/^details$/i.test(f[0]) || /posting date/i.test(f[1] || "")) continue;
    const m = (f[1] || "").match(/^(\d{2})\/(\d{2})/);
    if (!m) continue;
    const amt = parseFloat((f[3] || "").replace(/[$,]/g,""));
    if (!isFinite(amt)) continue;

    const kind = (f[4] || "").toUpperCase();
    const raw  = f[2] || "";
    const U    = raw.toUpperCase();
    let type = "Card Purchase", desc = tidy(raw);

    // Only the monthly one gets the tidy name — an incoming wire fee is also a
    // FEE_TRANSACTION, and renaming it would have deducted it as the monthly fee.
    if (kind === "FEE_TRANSACTION") {
      type = "Fee";
      desc = U.includes("MONTHLY SERVICE FEE") ? "Monthly Service Fee" : tidy(raw);
    }
    else if (kind === "ACCT_XFER")       { type = "Online Transfer"; desc = tidy(raw.replace(/\s*transaction#.*/i,"")); }
    else if (kind === "CHECK_PAID")      { type = "Check Paid"; }
    else if (kind === "ATM")             { type = "ATM Withdrawal"; desc = "ATM Withdrawal"; }
    else if (kind === "WIRE_INCOMING")   { const who = /B\/O:\s*([A-Z0-9'\-. ]+?)(?:\s+NOTPROVIDED|\s+REF:|\s+IMAD:|$)/.exec(U);
                                           type = "Deposit"; desc = "Incoming Wire" + (who ? " \u2013 " + who[1].trim() : ""); }
    else if (kind === "CHECK_DEPOSIT")   { type = "Deposit"; desc = "Remote Online Deposit"; }
    else if (kind === "CHASE_TO_PARTNERFI") { type = "Zelle Payment"; desc = tidy(raw); }
    else if (kind === "ATM_DEPOSIT")     { type = "Deposit"; desc = "ATM Check Deposit \u2013 " + tidy(raw.replace(/^ATM CHECK DEPOSIT\s*\d{2}\/\d{2}\s*/i,"")); }
    // Venmo and friends arrive as MISC_DEBIT but read like an ACH line, so they
    // take the same naming pass.
    else if (kind === "ACH_DEBIT" || kind === "ACH_CREDIT" || kind === "MISC_DEBIT"){
      type = kind === "ACH_CREDIT" ? "Deposit" : "Electronic Withdrawal";
      desc = null;
      if (U.includes("PAYPAL"))
        desc = U.includes("EBAY") ? "PayPal / eBay"
             : kind === "ACH_CREDIT" ? "PayPal \u2013 Transfer" : "PayPal \u2013 Purchase";
      else for (const [k,v] of ACH) if (U.includes(k)){ desc = v; break; }
      if (!desc) desc = tidy(raw.replace(/ORIG CO NAME:/i,"").replace(/ORIG ID:.*/i,""));
    } else {
      if (U.includes("APPLE CASH")) desc = "Apple Cash Sent Money";
      for (const [k,v] of SUBS_DESC) if (U.includes(k)){ type = "Recurring Card Purchase"; desc = v; break; }
    }

    out.push({d:m[1] + "/" + m[2], t:type, c:desc, a:Math.round(amt*100)/100, x:0});

    const bal = parseFloat((f[5] || "").replace(/[$,]/g,""));
    if (isFinite(bal)) prev.push({bal, amt});
  }

  for (let i = 0; i < prev.length - 1; i++){
    checked++;
    if (Math.abs((prev[i+1].bal + prev[i].amt) - prev[i].bal) > 0.005) breaks++;
  }
  chain = checked ? {checked, breaks} : null;

  // deposits first, then everything else, each in date order — matching the sheet
  const key = r => Number(r.d.slice(0,2)) * 100 + Number(r.d.slice(3));
  const dep = out.filter(r => r.t === "Deposit").sort((a,b) => key(a)-key(b));
  const rest= out.filter(r => r.t !== "Deposit").sort((a,b) => key(a)-key(b));
  return {rows:[...dep, ...rest], chain, problems};
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function guessMonth(rows){
  const tally = {};
  rows.forEach(r => { const m = r.d.slice(0,2); tally[m] = (tally[m]||0)+1; });
  const mm = Object.keys(tally).sort((a,b) => tally[b]-tally[a])[0] || "01";
  const now = new Date(), yr = now.getFullYear();
  return {mm, yr};
}

function token(){ try { return localStorage.getItem("tl.token") || ""; } catch(e){ return ""; } }
function setToken(t){
  try { t ? localStorage.setItem("tl.token", t) : localStorage.removeItem("tl.token"); } catch(e){}
}

/**
 * Every call to the backend. Throws an Error carrying the server's own words,
 * so the thing the page shows is the thing that actually went wrong.
 */
async function api(path, opts = {}){
  const res = await fetch(API + path, {
    method: opts.method || "GET",
    headers: {
      "Content-Type": "application/json",
      ...(token() ? {Authorization: "Bearer " + token()} : {})
    },
    ...(opts.body ? {body: JSON.stringify(opts.body)} : {})
  });
  let data = null;
  try { data = await res.json(); } catch(e){}
  if (res.status === 401 && path !== "/unlock" && !path.startsWith("/reset")){
    setToken(""); S.locked = true; render();
    throw new Error("Locked");
  }
  if (!res.ok) throw new Error((data && data.error) || ("Something went wrong (" + res.status + ")"));
  return data || {};
}

async function loadAll(){
  const [m, r, c] = await Promise.all([api("/months"), api("/config/rules"), api("/config/categories")]);
  S.months = (m.months || []).map(x => ({id:x.key, key:x.key, label:x.label, rows:x.rows || []}));
  if (r && r.rules) S.rules = {...DEFAULT_RULES, ...r.rules};
  S.cats = (c && c.categories) || {};
  if (!S.cur || !S.months.some(x => x.id === S.cur)) S.cur = S.months[0]?.id || null;
}

/** Set or clear one flag on one row: "x" to leave out, "i" to count by hand. */
async function setFlag(monthId, i, flag, value){
  const m = S.months.find(x => x.id === monthId);
  if (!m) return;
  const before = m.rows;
  const next = value === undefined ? (m.rows[i][flag] ? 0 : 1) : value;
  // Leaving out and counting by hand are opposites, so setting one clears the
  // other. A category code is a separate question and clears nothing.
  const pair = flag === "x" ? "i" : flag === "i" ? "x" : null;
  const rows = m.rows.map((r,k) => k === i ? {...r, [flag]: next, ...(pair && next ? {[pair]: 0} : {})} : r);
  m.rows = rows;
  render();
  try { await api("/months/" + monthId, {method:"PUT", body:{label:m.label, rows}}); }
  catch(e){
    m.rows = before; render();
    if (e.message !== "Locked") alert("That change didn't save. " + e.message);
  }
}

/**
 * Turn a description into a keyword worth learning: drop the phone number, the
 * trailing state, the store number, and keep the name at the front.
 */
function suggestKeyword(desc){
  // Chase writes MERCHANT then town then state. The town is the part that will
  // differ next time he buys the same thing somewhere else, so it goes.
  const TOWNS = ["lafayette","opelousas","broussard","maurice","rayne","carencro","scott",
    "duson","crowley","new iberia","lake charles","jennings","covington","henderson",
    "gonzales","denham spring","grand coteau","iowa","nacogdoches","palo alto","singapore",
    "kinder","coral springs","baton rouge","columbia","brou ssard"];
  let d = String(desc || "").toLowerCase()
    .replace(/\b\d{3}[- ]\d{3}[- ]?\d{4}\b/g, " ")        // phone number
    .replace(/\b[a-z]*\d[a-z0-9]{5,}\b/g, " ")             // order and reference codes
    .replace(/\b\d{4,}\b/g, " ")                           // bare reference numbers
    .replace(/[#*].*$/, " ")                                // store number onward
    .replace(/\b(la|tx|ca|ms|ar|mn|wa|or|ks|fl|ne|nv|hi)\b\s*$/, " ")
    .replace(/\s+/g, " ").trim();
  for (const t of TOWNS) {
    const at = d.lastIndexOf(t);
    if (at > 3 && at + t.length >= d.length - 3) {
      const cut = d.slice(0, at).trim();
      // "CITY OF BROUSSARD" is a payee, not a merchant in Broussard. If taking the
      // town away leaves a dangling word, the town was part of the name.
      if (cut.length >= 6 && !/\b(of|the|at|in|for|and|to)$/.test(cut)) d = cut;
      break;
    }
  }
  return d.replace(/\b(us|inc|llc)\s*$/, "").replace(/\s+/g, " ").trim().slice(0, 34);
}

/** Which list a learned keyword belongs in, given the row's type. */
function listFor(type){
  if (type === "Recurring Card Purchase") return "subs";
  if (type === "Card Purchase" || type === "Card Purchase With Pin") return "vendor";
  if (type === "Electronic Withdrawal") return "ew";
  return "always";   // transfers, Zelle, ATM and the rest match on description alone
}

/* ============ books: the same rows, coded the way a bookkeeper would ============ */

const GROUP_ORDER = ["Income","Job costs","Operating","Taxes","Debt","Owner & personal","Needs a decision"];

/**
 * Which account a row belongs to. A hand-set code on the row wins; after that
 * it is the first category whose keywords appear in the description. A cheque
 * never names its payee on a bank statement, so cheques land in their own
 * bucket to be coded by hand rather than guessed at.
 */
function codeRow(row, cats){
  if (row.g && (cats[row.g] || row.g === "_check" || row.g === "_none")) return row.g;
  const d = (row.c || "").toLowerCase(), amt = Number(row.a) || 0;
  for (const id of Object.keys(cats)){
    const c = cats[id];
    if (!(c.keys || []).some(k => k && d.includes(k))) continue;
    // An income account only ever takes money in. Without this a domestic
    // incoming wire FEE books as income because it says "incoming wire".
    if (c.group === "Income" && amt < 0) continue;
    return id;
  }
  if (row.t === "Check Paid") return "_check";
  if (row.t === "Deposit" || row.t === "Refund") return "_income";
  return "_none";
}

function catLabel(id){
  if (id === "_check")  return {group:"Needs a decision", label:"Cheques — payee is not on the statement"};
  if (id === "_none")   return {group:"Needs a decision", label:"Not coded yet"};
  if (id === "_income") return {group:"Income", label:"Money in, uncategorised"};
  return S.cats[id] || {group:"Needs a decision", label:id};
}

function booksTotals(rows){
  const by = {};
  for (const r of rows){
    const id = codeRow(r, S.cats);
    (by[id] = by[id] || {n:0, sum:0, rows:[]});
    by[id].n++; by[id].sum += Number(r.a) || 0; by[id].rows.push(r);
  }
  return by;
}

function renderBooks(m){
  const main = $("#main");
  const rows = S.all ? S.months.flatMap(x => x.rows.map(r => ({...r, _m:x.label, _id:x.id})))
                     : m.rows.map((r,i) => ({...r, _id:m.id, _i:i}));
  const by = booksTotals(rows);
  const out = Object.values(by).reduce((n,v) => n + (v.sum < 0 ? v.sum : 0), 0);
  const inc = Object.values(by).reduce((n,v) => n + (v.sum > 0 ? v.sum : 0), 0);

  const groups = {};
  for (const [id, v] of Object.entries(by)){
    const meta = catLabel(id);
    (groups[meta.group] = groups[meta.group] || []).push({id, ...v, label: meta.label});
  }
  const order = [...GROUP_ORDER.filter(g => groups[g]), ...Object.keys(groups).filter(g => !GROUP_ORDER.includes(g))];

  const needs = (by._check?.n || 0) + (by._none?.n || 0);
  const needsSum = (by._check?.sum || 0) + (by._none?.sum || 0);

  main.innerHTML = `
    <section class="summary">
      <div class="cell owed">
        <div class="k">Money in${S.all ? " · all months" : ""}</div>
        <div class="v num">${money(inc)}</div>
        <div class="sub">${money(out)} out &middot; ${money(inc + out)} net</div>
      </div>
      <div class="cell"><div class="k">Rows</div><div class="v num">${rows.length}</div></div>
      <div class="cell"><div class="k">Accounts used</div><div class="v num">${Object.keys(by).length}</div></div>
      <div class="cell"><div class="k">Still to code</div>
        <div class="v num" style="color:${needs ? "var(--park)" : "var(--accent)"}">${needs}</div>
        <div class="sub">${money(needsSum)}</div></div>
    </section>

    <div class="bar">
      <span class="count" style="margin:0">A bookkeeper's view of the same rows. Coding here does not change the tithe.</span>
      <button class="chip" id="allMonthsB" aria-pressed="${S.all}">All months</button>
      <button class="chip" id="csv">Copy for a spreadsheet</button>
    </div>

    <div class="scroll"><table>
      <thead><tr><th>Account</th><th class="r-amt">Amount</th><th class="r-amt">Rows</th><th class="r-amt">Share of spend</th></tr></thead>
      <tbody>
        ${order.map(g => {
          const items = groups[g].sort((a,b) => a.sum - b.sum);
          const gsum = items.reduce((n,i) => n + i.sum, 0);
          return `<tr class="grp"><td><b>${esc(g)}</b></td><td class="r-amt num"><b>${money(gsum)}</b></td>
                  <td class="r-amt num">${items.reduce((n,i)=>n+i.n,0)}</td><td></td></tr>` +
            items.map(i => `<tr class="acct" data-cat="${esc(i.id)}">
              <td style="padding-left:26px">${esc(i.label)}${i.id === "_check" || i.id === "_none"
                  ? ' <span class="tag off">code these</span>' : ""}</td>
              <td class="r-amt num ${i.sum < 0 ? "neg" : "pos"}">${money(i.sum)}</td>
              <td class="r-amt num">${i.n}</td>
              <td class="r-amt num" style="color:var(--ink-3)">${
                i.sum < 0 && out ? (i.sum / out * 100).toFixed(1) + "%" : "—"}</td>
            </tr>`).join("");
        }).join("")}
      </tbody>
    </table></div>
    <div id="drill"></div>`;

  $("#allMonthsB").addEventListener("click", () => { S.all = !S.all; render(); });
  $("#csv").addEventListener("click", () => copyBooks(by, order, groups));
  main.querySelectorAll(".acct").forEach(tr =>
    tr.addEventListener("click", () => drillInto(tr.dataset.cat, by[tr.dataset.cat])));
}

/** The rows behind one account, each with a way to re-code it. */
function drillInto(id, bucket){
  if (!bucket) return;
  const meta = catLabel(id);
  const el = $("#drill");
  el.innerHTML = `
    <h3 style="font-family:Newsreader,Georgia,serif;font-weight:500;font-size:19px;margin:26px 0 10px">
      ${esc(meta.label)} <span style="color:var(--ink-3);font-size:14px">&middot; ${bucket.n} rows</span></h3>
    <div class="scroll"><table><tbody>
      ${bucket.rows.slice(0, 200).map(r => `<tr>
        <td class="r-date num">${esc(r.d)}${r._m ? `<br><small style="color:var(--ink-3)">${esc(r._m)}</small>` : ""}</td>
        <td class="r-desc">${esc(r.c)}</td>
        <td class="r-amt num ${r.a < 0 ? "neg" : "pos"}">${money(r.a)}</td>
        <td class="r-amt"><button class="btn" style="padding:3px 10px;font-size:12px"
             data-code="${esc(r._id)}" data-i="${r._i}">Code it</button></td>
      </tr>`).join("")}
    </tbody></table></div>
    ${bucket.rows.length > 200 ? `<p class="note">Showing the first 200 of ${bucket.rows.length}.</p>` : ""}`;
  el.querySelectorAll("[data-code]").forEach(b => b.addEventListener("click", () => {
    const m = S.months.find(x => x.id === b.dataset.code);
    const row = m && m.rows[+b.dataset.i];
    if (row) codePanel(b.dataset.code, +b.dataset.i, row);
  }));
  el.scrollIntoView({behavior:"smooth", block:"start"});
}

/** Put one row in an account — just it, or everything like it. */
function codePanel(monthId, i, row){
  const ids = Object.keys(S.cats).sort((a,b) =>
    (S.cats[a].group + S.cats[a].label).localeCompare(S.cats[b].group + S.cats[b].label));
  const s = panel("Code this row", `
    <p class="hint">${esc(row.c)}<br><span style="color:var(--ink-3)">${esc(row.t)} &middot; ${money(row.a)}</span></p>
    <form id="cform">
      <label style="display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600;margin:16px 0 6px">Account</label>
      <select id="cat" style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit">
        ${ids.length ? ids.map(id => `<option value="${esc(id)}">${esc(S.cats[id].group)} &rsaquo; ${esc(S.cats[id].label)}</option>`).join("")
                     : '<option value="">No accounts set up yet</option>'}
      </select>
      <label style="display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600;margin:16px 0 6px">And everything containing (optional)</label>
      <input id="ckw" type="text" value="${esc(row.t === "Check Paid" ? "" : suggestKeyword(row.c))}"
             placeholder="leave empty to code only this row"
             style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:13px">
      ${row.t === "Check Paid" ? '<p class="fine">A cheque number is unique, so there is nothing useful to learn from it. This one gets coded on its own.</p>' : ""}
      <p class="err" id="cerr" hidden></p>
      <div class="pfoot">
        <button class="btn" type="button" data-close>Cancel</button>
        <button class="btn primary" type="submit">Code it</button>
      </div>
    </form>`);
  s.querySelector("#cform").addEventListener("submit", async e => {
    e.preventDefault();
    const id = s.querySelector("#cat").value;
    const kw = s.querySelector("#ckw").value.trim().toLowerCase();
    const err = s.querySelector("#cerr");
    if (!id){ err.hidden = false; err.textContent = "Set up an account first."; return; }
    if (kw){
      if (!row.c.toLowerCase().includes(kw)){
        err.hidden = false; err.textContent = "That does not appear in this row, so it would not match it."; return;
      }
      await saveCats({...S.cats, [id]: {...S.cats[id], keys:[...(S.cats[id].keys || []), kw]}});
    } else {
      await setFlag(monthId, i, "g", id);
    }
    s.remove();
  });
}

async function saveCats(next){
  const before = S.cats;
  S.cats = next; render();
  try { await api("/config/categories", {method:"PUT", body:{categories:next}}); }
  catch(e){
    S.cats = before; render();
    if (e.message !== "Locked") alert("That didn't save. " + e.message);
  }
}

/** Straight to the clipboard, so it can go to a CPA in a spreadsheet. */
function copyBooks(by, order, groups){
  const lines = [["Group","Account","Amount","Rows"].join("\t")];
  for (const g of order)
    for (const i of groups[g].sort((a,b) => a.sum - b.sum))
      lines.push([g, i.label, i.sum.toFixed(2), i.n].join("\t"));
  navigator.clipboard.writeText(lines.join("\n")).then(
    () => { const b = $("#csv"); b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy for a spreadsheet", 1600); },
    () => alert("Couldn't reach the clipboard.")
  );
}

/* ============ panels ============ */
function panel(title, inner){
  const s = document.createElement("div");
  s.className = "scrim";
  s.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="phead"><h2>${esc(title)}</h2><button class="btn" data-close>Close</button></div>
    <div class="pbody">${inner}</div></div>`;
  s.addEventListener("click", e => { if (e.target === s || e.target.hasAttribute("data-close")) s.remove(); });
  document.body.appendChild(s);
  return s;
}

$("#btnPaste").addEventListener("click", () => {
  const s = panel("Paste a month", `
    <p class="hint">Download the activity from Chase and paste it here, header row and all.
      Nothing is saved until you say so.</p>
    <textarea id="ta" spellcheck="false" placeholder="Details,Posting Date,Description,Amount,Type,Balance,Check or Slip #&#10;DEBIT,07/31/2026,&quot;MONTHLY SERVICE FEE&quot;,-7.50,FEE_TRANSACTION,20344.93,,"></textarea>
    <div id="out"></div>
    <div class="pfoot" id="foot1">
      <button class="btn" data-close>Cancel</button>
      <button class="btn" id="read">Read it</button>
    </div>`);
  const ta = s.querySelector("#ta"), out = s.querySelector("#out");
  s.querySelector("#read").addEventListener("click", () => {
    const {rows, chain} = parseExport(ta.value);
    const f1 = s.querySelector('#foot1'); if (f1) f1.style.display = 'none';
    if (!rows.length){ out.innerHTML = `<div class="readout"><span class="bad">Nothing readable in there.</span>
      Paste the whole export, including the header row.</div>`; return; }
    const {mm, yr} = guessMonth(rows);
    const t = totals(rows, S.rules);
    const existing = S.months.find(x => x.key === `${yr}-${mm}`);
    out.innerHTML = `<div class="readout">
      <div class="row"><span>Rows read</span><span>${rows.length}</span></div>
      <div class="row"><span>Month</span><span>${MONTHS[+mm-1]} ${String(yr).slice(2)}</span></div>
      <div class="row"><span>Running balance</span><span>${chain
        ? (chain.breaks === 0
            ? `<span class="ok">checks out across ${chain.checked}</span>`
            : `<span class="bad">${chain.breaks} break${chain.breaks>1?"s":""}</span>`)
        : "no balance column"}</span></div>
      <div class="row"><span>Income</span><span>${money(t.income)}</span></div>
      <div class="row"><span>Counted toward tithe</span><span>${money(t.base)}</span></div>
      <div class="row"><span>Tithes owed</span><span><b>${money(t.owed)}</b></span></div>
      ${existing ? `<div class="row"><span class="bad">${MONTHS[+mm-1]} already exists</span><span>saving replaces it</span></div>` : ""}
    </div>
    <div class="pfoot">
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="save">${existing ? "Replace" : "Save"} ${MONTHS[+mm-1]} ${String(yr).slice(2)}</button>
    </div>`;
    out.querySelector("#save").addEventListener("click", async () => {
      const key = `${yr}-${mm}`;
      const label = `${MONTHS[+mm-1]} ${String(yr).slice(2)}`;
      const btn = out.querySelector("#save");
      btn.disabled = true; btn.textContent = "Saving\u2026";
      try {
        await api("/months/" + key, {method:"PUT", body:{label, rows}});
        await loadAll();
      } catch(ex){
        btn.disabled = false; btn.textContent = "Try again";
        alert(ex.message); return;
      }
      S.cur = key; S.all = false; s.remove(); render();
    });
  });
  ta.focus();
});

$("#btnRules").addEventListener("click", () => {
  const s = panel("Rules", Object.keys(RULE_META).map(k => `
    <div class="rule">
      <h3>${RULE_META[k].name}</h3>
      <p>${RULE_META[k].why}</p>
      <div class="keys" data-list="${k}">
        ${(S.rules[k]||[]).map(v => `<span class="key">${esc(v)}<button data-del="${esc(v)}" data-k="${k}" aria-label="Remove ${esc(v)}">&times;</button></span>`).join("")}
        <button class="addkey" data-add="${k}">+ add</button>
      </div>
    </div>`).join("") + `
    <p class="note">A row matches when its description <b>contains</b> one of these, ignoring case.
    Checks, deposits and Apple Cash are handled in the code and need no keywords.
    Changing a rule here re-figures every month at once, including the ones already saved.</p>`);

  s.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", async () => {
    const k = b.dataset.add;
    const v = prompt(`New ${RULE_META[k].name.toLowerCase()} keyword.\nLowercase, and part of the description is enough.`);
    if (!v || !v.trim()) return;
    await saveRules({...S.rules, [k]:[...(S.rules[k]||[]), v.trim().toLowerCase()]});
    s.remove();
  }));
  s.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
    const k = b.dataset.k, v = b.dataset.del;
    await saveRules({...S.rules, [k]:(S.rules[k]||[]).filter(x => x !== v)});
    s.remove();
  }));
});

async function saveRules(next){
  const before = S.rules;
  S.rules = next; render();
  try { await api("/config/rules", {method:"PUT", body:{rules:next}}); }
  catch(e){
    S.rules = before; render();
    if (e.message !== "Locked") alert("That rule didn't save. " + e.message);
  }
}

$("#btnBooks").addEventListener("click", () => {
  S.view = S.view === "books" ? "ledger" : "books";
  $("#btnBooks").textContent = S.view === "books" ? "Ledger" : "Books";
  render();
});

$("#btnPw").addEventListener("click", () => passwordPanel());

$("#btnLock").addEventListener("click", () => {
  setToken(""); S.locked = true; S.months = []; render();
});

boot();
</script>
